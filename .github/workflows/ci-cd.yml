name: CI/CD

# Déclencheurs du pipeline :
#  - à chaque push sur la branche main (intégration + déploiement staging) ;
#  - à chaque pull request ciblant main (intégration uniquement, gate de qualité).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions minimales par défaut ; le job de déploiement les élargit localement.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : TEST
  # Exécution automatique des tests unitaires + d'intégration.
  # Sert de « gate » : aucun déploiement n'a lieu si ce job échoue.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances (reproductible)
        run: npm ci

      - name: Compilation TypeScript
        run: npm run build

      - name: Exécution des tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 2 : DEPLOY-STAGING
  # Déploiement continu vers le staging : construction de l'image Docker et
  # publication sur GHCR (GitHub Container Registry).
  # Ne s'exécute QUE sur un push vers main ET seulement si le job `test` réussit.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Build & publication image staging (GHCR)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      # Le nom des dépôts GHCR doit être en minuscules. On dérive donc le
      # propriétaire en minuscules à partir de github.repository_owner.
      - name: Calcul du propriétaire en minuscules
        id: owner
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et publication de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/ci-cd-minimaliste:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/ci-cd-minimaliste:staging
            ghcr.io/${{ steps.owner.outputs.lc }}/ci-cd-minimaliste:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
